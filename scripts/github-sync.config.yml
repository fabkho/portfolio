# GitHub Sync Configuration
# Defines which repos to feature as projects and which external repos to track contributions in.

projects:
  # Repos to EXCLUDE from auto-sync (profile READMEs, forks, experiments, etc.).
  # Alternative: set `hidden: true` in overrides to keep rationale near repo metadata.
  exclude:
    - fabkho/fabian-kho
    - fabkho/portfolio
    - fabkho/slides
    - fabkho/zmk-config
    - fabkho/doppelganger
    - fabkho/zoom_lite
    - fabkho/chat_room
    - fabkho/vite-vanillaJs-basic-setup
    - fabkho/vite-nuxt-basic-setup
    - fabkho/slidev-theme-anny
    - fabkho/FlexonEgzon

  # Manual overrides — merged on top of GitHub API data
  overrides:
    the-i18n-kit:
      order: 1
      featured: true
      tag: "DEVTOOL"
      label: "I18N-KIT"
      description: "MCP server + CLI for i18n — let your AI agent manage translations across Nuxt, Laravel, and any framework."
      specs: ["MCP", "NUXT", "LARAVEL", "TYPESCRIPT", "AI"]
      stack: ["TypeScript", "Zod", "MCP SDK", "Vue", "PHP"]

    pi-multirepo:
      order: 2
      featured: true
      tag: "AGENT TOOLING"
      label: "PI-MULTIREPO"
      description: "Pi extension for multi-repo bugfixing — ClickUp to MR in one command."
      specs: ["TYPESCRIPT", "PI", "GIT"]
      stack: ["TypeScript"]

    cmd-bar:
      order: 4
      tag: "VUE COMPONENT"
      label: "CMD-BAR"
      description: "Performant, unstyled command palette for Vue 3."
      specs: ["VUE", "TYPESCRIPT", "A11Y"]
      stack: ["Vue", "TypeScript"]

    vue-tray-color-picker:
      order: 8
      tag: "VUE COMPONENT"
      label: "TRAY COLOR PICKER"
      description: "Dependency-free colour picker for Vue 3 — a floating swatch tray over a constrained hue and shade ladder."
      specs: ["VUE", "TYPESCRIPT", "A11Y"]
      stack: ["Vue", "TypeScript"]

    vue-leave-guards:
      order: 9
      tag: "VUE COMPOSABLE"
      label: "LEAVE-GUARDS"
      description: "Nested unsaved-changes guards for Vue 3 — a dirty form inside a modal inside a drawer collapses into one route guard."
      specs: ["VUE", "TYPESCRIPT", "COMPOSABLE"]
      stack: ["Vue", "TypeScript"]

    fontawesome-esm:
      order: 5
      tag: "BUILD TOOL"
      label: "FONTAWESOME-ESM"
      description: "Convert FontAwesome CJS icons to ES Modules for tree-shaking in Vue/Nuxt."
      specs: ["VUE", "BUNDLER", "PERFORMANCE"]
      stack: ["Vue", "JavaScript"]

    arc_boosts:
      order: 6
      tag: "BROWSER"
      label: "ARC-BOOSTS"
      description: "Collection of Arc browser boosts for Spotify, Google Calendar, and YouTube."
      specs: ["CSS", "JAVASCRIPT"]
      stack: ["CSS", "JavaScript"]

    i-love-pi:
      order: 7
      tag: "EXPERIMENT"
      label: "I-LOVE-PI"
      description: "Experimental Pi coding agent extensions and workflows."
      specs: ["TYPESCRIPT", "AI"]
      stack: ["TypeScript"]

    reading-tracker-cli:
      order: 3
      tag: "CLI TOOL"
      label: "READING-TRACKER"
      description: "Track your reading progress from the terminal."
      specs: ["TYPESCRIPT", "CLI"]
      stack: ["TypeScript"]
      # Private repo — manually defined
      url: "https://github.com/fabkho/reading-tracker-cli"
      private: true

    anny-co:
      order: 10
      tag: "PROFESSIONAL"
      label: "ANNY.CO"
      title: "anny.co"
      description: "Booking and resource management platform — full-stack development."
      specs: ["VUE", "NUXT", "LARAVEL", "TYPESCRIPT"]
      stack: ["Vue", "Nuxt", "Laravel", "TypeScript"]
      url: "https://anny.co"
      private: true

contributions:
  # Organizations to scan for merged PRs by fabkho (searches ALL repos in org)
  track_orgs:
    - nuxt
    - vuejs
    - laravel

  # Individual repos to scan (for repos outside tracked orgs)
  track_repos:
    - spatie/holidays

  # PRs to feature on the home page. Full contribution archive still renders on /projects.
  major_prs:
    - https://github.com/nuxt/nuxt/pull/34318
    - https://github.com/nuxt/hints/pull/322
    - https://github.com/laravel/scout/pull/908
    - https://github.com/spatie/holidays/pull/280

  # PRs to exclude (noise, school projects, etc.)
  exclude_prs:
    - https://github.com/FlexonEgzon/abalo2/pull/7
